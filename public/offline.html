<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Buddy — Offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f3ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e1b2e;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
      }
      .emoji {
        font-size: 56px;
        line-height: 1;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        color: #7c3aed;
      }
      p {
        font-size: 15px;
        color: #4b5563;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 12px;
        background: #7c3aed;
        color: white;
        font-weight: 600;
        font-size: 15px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📴📚</div>
      <h1>You're offline</h1>
      <p>
        No internet connection right now. Any reading you log will be saved on
        this device and synced automatically once you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
